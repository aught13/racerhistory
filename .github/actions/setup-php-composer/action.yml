name: "Setup PHP + Composer"
description: "Sets up PHP and installs Composer dependencies (with cache)"

inputs:
  php-version:
    description: "PHP version"
    required: true
  extensions:
    description: "Comma-separated PHP extensions"
    required: false
    default: "mbstring, intl, pdo_mysql, zip, curl, xml, json"
  tools:
    description: "Tools to install via setup-php"
    required: false
    default: "composer"
  coverage:
    description: "Coverage driver (xdebug/pcov/none)"
    required: false
    default: "none"
  ini-values:
    description: "Additional ini-values for setup-php"
    required: false
    default: ""
  dependency-versions:
    description: "ramsey/composer-install dependency-versions"
    required: false
    default: "highest"
  composer-options:
    description: "Extra composer options"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        tools: ${{ inputs.tools }}
        coverage: ${{ inputs.coverage }}
        ini-values: ${{ inputs.ini-values }}

    - name: Composer install
      uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520
      with:
        dependency-versions: ${{ inputs.dependency-versions }}
        composer-options: ${{ inputs.composer-options }}
      env:
        COMPOSER_ALLOW_SUPERUSER: 1
