name: Update Status Badges

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, curl, xml, json
          tools: composer
          dependency-versions: 'highest'
          composer-options: '--no-progress --prefer-dist --ignore-platform-req=php'

      - name: Install markdownlint-cli
        run: npm i -g markdownlint-cli

      - name: Extract CakePHP version
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r '.packages[] | select(.name=="cakephp/cakephp") | .version' composer.lock)
          jq -n --arg ver "$version" '{version: $ver, notes: "Auto-updated by CI from composer.lock"}' > cakephp-version.json

      - name: Run PHPCS and update status
        shell: bash
        run: |
          set -euo pipefail
          if php vendor/bin/phpcs --standard=phpcs.xml src/ tests/ > /dev/null 2>&1; then
            status="passing"
          else
            status="failing"
          fi
          jq -n --arg st "$status" '{status: $st, notes: "Auto-updated by CI based on PHPCS check results."}' > phpcs-status.json

      - name: Compute documentation coverage and update JSON
        shell: bash
        run: |
          set -euo pipefail
          # Target Markdown files: root README + templates folder + docs at root
          mapfile -t files < <(git ls-files '**/*.md' | grep -E '^(README\.md|templates/|AUTHORIZATION_SETUP\.md|templates/README\.md)$' || true)
          total=${#files[@]}
          if [[ $total -eq 0 ]]; then
            percent="0%"
          else
            # Run markdownlint and count problems; fewer problems => higher coverage
            # Each file starts at 100 points, each lint issue subtracts 1 point, floored at 0
            score=0
            for f in "${files[@]}"; do
              issues=$(markdownlint -s "$f" || true)
              # Count lines in issues output; empty output => 0 issues
              count=$(printf "%s" "$issues" | awk 'NF{c++} END{print c+0}')
              pts=$((100 - count))
              if (( pts < 0 )); then pts=0; fi
              score=$((score + pts))
            done
            # Average across files
            avg=$(awk -v s="$score" -v t="$total" 'BEGIN{printf "%.0f", (s / t)}')
            # Convert to percent (0-100%)
            percent="${avg}%"
          fi

          jq -n --arg pct "$percent" '{documentationPercent: $pct, notes: "Auto-updated by CI via markdownlint-based coverage."}' > docs-status.json

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- docs-status.json phpcs-status.json cakephp-version.json; then
            echo "No changes to status files"
            exit 0
          fi

          # We're currently on the workflow trigger branch (typically master) to ensure
          # the status files reflect the latest code. Stash the generated JSON updates
          # so we can switch branches without losing them.
          git stash push -m "status-badges" -- docs-status.json phpcs-status.json cakephp-version.json

          # Switch to (or create) update_ci branch, then apply the stashed changes.
          git fetch origin update_ci || true
          if git show-ref --verify --quiet refs/remotes/origin/update_ci; then
            git switch --force-create update_ci origin/update_ci
          else
            git switch --create update_ci
          fi

          # Restore files from the stash, overwriting whatever is in update_ci.
          git restore --source=stash@{0} -- docs-status.json phpcs-status.json cakephp-version.json
          git stash drop stash@{0}

          git add docs-status.json phpcs-status.json cakephp-version.json
          git commit -m "chore(ci): update status badges"
          git push origin update_ci

          echo "Pushed status updates to update_ci branch"
