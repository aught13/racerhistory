name: Security

on:
  push:
    branches: [v-0.2.0.beta, v-1.0.dev]
  pull_request:
    branches: [v-0.2.0.beta, v-1.0.dev]
  schedule:
    # Run security scan every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.3"
          extensions: mbstring, intl, zip, curl, xml, json
          tools: composer:v2
          dependency-versions: "highest"

      - name: Run Security Audit
        run: |
          # Use Composer's built-in security audit (available in Composer 2.4+)
          composer audit --format=json > security-report.json || true

          # Add summary to job output
          echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
          composer audit --no-dev || echo "Security vulnerabilities found - check the full report" >> $GITHUB_STEP_SUMMARY

      - name: Upload security report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        if: always()
        with:
          name: security-report
          path: security-report.json
