name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Run security scan every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@9e3e5c00865167583515a69f8f299ec52ffb4058 # v2.30.6 (full SHA pinned)
        with:
          php-version: "8.3"
          extensions: mbstring, intl, zip, curl, xml, json
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-security-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-security-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Security Audit
        run: |
          # Use Composer's built-in security audit (available in Composer 2.4+)
          composer audit --format=json > security-report.json || true

          # Add summary to job output
          echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
          composer audit --no-dev || echo "Security vulnerabilities found - check the full report" >> $GITHUB_STEP_SUMMARY

      - name: GitHub Security Advisory Check
        uses: github/osv-scanner-action@0a71af12b0e01b2c0e1b9d71ee5e5977ac05a96d # v1.8.5
        with:
          scan-args: |-
            --lockfile
            ./composer.lock

      - name: Upload security report
        uses: actions/upload-artifact@f1a9a9406c1c2c2c8e85b2e1fa53232fddc7a3c4 # v4.4.3
        if: always()
        with:
          name: security-report
          path: security-report.json

  psalm-security:
    name: Psalm Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@9e3e5c00865167583515a69f8f299ec52ffb4058 # v2.30.6 (full SHA pinned)
        with:
          php-version: "8.3"
          extensions: mbstring, intl, zip, curl, xml, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Psalm Security Analysis
        run: |
          if [ -f psalm.xml ]; then
            vendor/bin/psalm --output-format=github --taint-analysis
          else
            echo "Psalm configuration not found, skipping security analysis"
          fi
        continue-on-error: true
