name: CI
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run End-to-End (E2E) Tests?'
        required: true
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  preflight:
    name: Preflight Planner
    runs-on: ubuntu-24.04
    outputs:
      run_php: ${{ steps.plan.outputs.run_php }}
      run_js: ${{ steps.plan.outputs.run_js }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Plan jobs from changed files
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          MANUAL_E2E: ${{ inputs.run_e2e }}
        run: |
          set -euo pipefail

          run_php=true
          run_js=true
          run_e2e=false
          changed_files=""

          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" || true)"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA" || true)"
          fi

          if [[ -n "$changed_files" ]]; then
            run_php=false
            run_js=false

            if grep -Eq '^(src/|config/|templates/|tests/|plugins/|bin/|composer\.json|composer\.lock|phpunit\.xml|phpunit\.xml\.dist|phpunit\.ci\.xml|phpcs\.xml|phpstan\.neon|phpstan-baseline\.neon)' <<< "$changed_files"; then
              run_php=true
            fi

            if grep -Eq '^(webroot/js/|js/|__mocks__/|package\.json|package-lock\.json|jest\.setup\.js|eslint\.config\.cjs|stylelint\.config\.cjs)' <<< "$changed_files"; then
              run_js=true
            fi
          fi

          # E2E is strictly optional and manual via workflow_dispatch input
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_E2E" == "true" ]]; then
            run_e2e=true
          fi

          echo "run_php=$run_php" >> "$GITHUB_OUTPUT"
          echo "run_js=$run_js" >> "$GITHUB_OUTPUT"
          echo "run_e2e=$run_e2e" >> "$GITHUB_OUTPUT"

          {
            echo "### Preflight Plan"
            echo "- run_php: $run_php"
            echo "- run_js: $run_js"
            echo "- run_e2e: $run_e2e"
          } >> "$GITHUB_STEP_SUMMARY"
  legacy-runtime-guard:
    name: Legacy Runtime Guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Fail on deprecated runtime compatibility markers
        run: bash scripts/ci/check-legacy-runtime-guards.sh

  testsuite:
    needs: preflight
    if: ${{ needs.preflight.outputs.run_php == 'true' }}
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: racerhistory_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.2"
            dependencies: "lowest"
            composer-options: ""
            coverage: true
          - php-version: "8.4"
            dependencies: "highest"
            composer-options: ""
            coverage: false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install NPM deps
        run: npm ci

      - name: Build frontend assets (Vite)
        run: npm run build

      - name: Verify built frontend runtime
        run: |
          test -f webroot/dist/manifest.json
          grep -q '"js/main.js"' webroot/dist/manifest.json
      - name: Setup PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_mysql, zip, curl, xml, json
          ini-values: zend.assertions=1
          coverage: ${{ matrix.coverage == true && 'xdebug' || 'none' }}
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ matrix.composer-options }}

      - name: Validate Composer dependencies
        run: composer validate --strict --no-check-publish

      - name: Copy configuration file
        run: cp config/app_local.example.php config/app_local.php

      - name: Setup test database configuration
        run: |
          sed -i "s/'host' => 'localhost'/'host' => '127.0.0.1'/" config/app_local.php
          sed -i "s/'username' => 'my_app'/'username' => 'test_user'/" config/app_local.php
          sed -i "s/'password' => 'secret'/'password' => 'test_password'/" config/app_local.php
          sed -i "s/'database' => 'my_app'/'database' => 'racerhistory_test'/" config/app_local.php
          sed -i "s/'url' => env('DATABASE_TEST_URL', 'sqlite:\/\/\/.*')/'url' => env('DATABASE_TEST_URL', 'mysql:\/\/test_user:test_password@127.0.0.1:3306\/racerhistory_test')/" config/app_local.php
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot && break
            echo "Waiting for MySQL to be ready..."
            sleep 2
          done
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS racerhistory_test; GRANT ALL PRIVILEGES ON racerhistory_test.* TO 'test_user'@'%';"
      - name: Fix migration compatibility
        run: |
          echo "=== Detecting installed migrations plugin version ==="
          shopt -s nullglob
          migration_files=(config/Migrations/[0-9]*.php)
          seed_files=(config/Seeds/*.php)
          echo "Found ${#migration_files[@]} migration file(s), ${#seed_files[@]} seed file(s)."

          if [ -f "vendor/cakephp/migrations/src/BaseMigration.php" ]; then
            echo "Using 5.x classes (BaseMigration / BaseSeed)"
            for f in "${migration_files[@]}"; do
              sed -i 's/use Migrations\\AbstractMigration;/use Migrations\\BaseMigration;/g' "$f"
              sed -i 's/extends AbstractMigration/extends BaseMigration/g' "$f"
            done
            for f in "${seed_files[@]}"; do
              sed -i 's/use Migrations\\AbstractSeed;/use Migrations\\BaseSeed;/g' "$f"
              sed -i 's/extends AbstractSeed/extends BaseSeed/g' "$f"
            done
            PARENT_FILE="vendor/cakephp/migrations/src/BaseMigration.php"
          else
            echo "Using legacy classes (AbstractMigration / AbstractSeed)"
            for f in "${migration_files[@]}"; do
              sed -i 's/use Migrations\\BaseMigration;/use Migrations\\AbstractMigration;/g' "$f"
              sed -i 's/extends BaseMigration/extends AbstractMigration/g' "$f"
            done
            for f in "${seed_files[@]}"; do
              sed -i 's/use Migrations\\BaseSeed;/use Migrations\\AbstractSeed;/g' "$f"
              sed -i 's/extends AbstractSeed/extends AbstractSeed/g' "$f"
            done
            PARENT_FILE="vendor/cakephp/migrations/src/AbstractMigration.php"
          fi

          echo "=== Fixing autoId property type ==="
          if grep -q 'public bool \$autoId' "$PARENT_FILE" 2>/dev/null; then
            echo "Parent requires typed bool."
            for f in "${migration_files[@]}"; do
              perl -pi -e 's/public\s+(?:bool\s+)?\$autoId\s*=\s*(true|false)\s*;/public bool \$autoId = $1;/g' "$f"
            done
          else
            echo "Parent requires untyped."
            for f in "${migration_files[@]}"; do
              perl -pi -e 's/public\s+(?:bool\s+)?\$autoId\s*=\s*(true|false)\s*;/public \$autoId = $1;/g' "$f"
            done
          fi
      - name: Run database migrations
        run: bin/cake migrations migrate
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Clear application caches
        run: |
          rm -rf tmp/cache/models/*
          rm -rf tmp/cache/persistent/*
          bin/cake cache clear_all || true
      - name: Composer post install
        run: composer run-script post-install-cmd --no-interaction

      - name: Run PHPUnit (with coverage)
        if: ${{ matrix.coverage == true }}
        run: |
          echo "=== Running test suite with coverage ==="
          vendor/bin/phpunit --configuration phpunit.ci.xml        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test
          XDEBUG_MODE: coverage
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run PHPUnit (without coverage)
        if: ${{ matrix.coverage == false }}
        run: |
          echo "=== Running PHPUnit without coverage (default config) ==="
          vendor/bin/phpunit        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.coverage == true }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: php82-lowest,unittests
          name: codecov-racerhistory

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.php-version }}
          path: test-results.xml

  coding-standard:
    name: Coding Standard & Static Analysis
    needs: preflight
    if: ${{ needs.preflight.outputs.run_php == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.4"
          extensions: mbstring, intl
          tools: cs2pr
          coverage: none
          ini-values: memory_limit=512M
          dependency-versions: "highest"

      - name: Copy configuration file
        run: cp config/app_local.example.php config/app_local.php

      - name: Run PHP CodeSniffer
        run: vendor/bin/phpcs --report=checkstyle | cs2pr

      - name: Run PHPStan
        if: always()
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=512M
        env:
          SECURITY_SALT: f76f1c8475585c46c6acd3ddcb8f5e0f15de524637bb4080a08c4afe7cfc9144

  js-tests:
    name: JavaScript Tests & Quality Checks
    needs: preflight
    if: ${{ needs.preflight.outputs.run_js == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM deps
        run: npm ci --no-audit --no-fund

      - name: Run ESLint (JS Quality)
        run: npm run lint:js

      - name: Check Prettier formatting
        run: npm run format:js:check

      - name: Run CSS lint (CSS Quality)
        run: npm run lint:css

      - name: Run Jest tests with coverage
        run: npm run test:js -- --ci --coverage

      - name: Upload JS coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-js/clover.xml
          flags: jstests
          name: codecov-js

  e2e-tests:
    name: E2E Tests (Playwright shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    needs: preflight
    if: ${{ needs.preflight.outputs.run_e2e == 'true' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4]
        shard_total: [4]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: racerhistory_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP for dev server
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql
          coverage: none
          dependency-versions: "highest"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM deps
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets (Vite)
        run: npm run build

      - name: Configure e2e hostname
        run: |
          echo "127.0.0.1 ci-e2e.invalid" | sudo tee -a /etc/hosts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Copy configuration file
        run: cp config/app_local.example.php config/app_local.php

      - name: Setup test database configuration
        run: |
          sed -i "s/'host' => 'localhost'/'host' => '127.0.0.1'/" config/app_local.php
          sed -i "s/'username' => 'my_app'/'username' => 'test_user'/" config/app_local.php
          sed -i "s/'password' => 'secret'/'password' => 'test_password'/" config/app_local.php
          sed -i "s/'database' => 'my_app'/'database' => 'racerhistory_test'/" config/app_local.php

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot && break
            echo "Waiting for MySQL to be ready..."
            sleep 2
          done
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS racerhistory_test; GRANT ALL PRIVILEGES ON racerhistory_test.* TO 'test_user'@'%';"

      - name: Run database migrations
        run: bin/cake migrations migrate
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Seed E2E test data
        run: bin/cake seeds run E2eSeedData
        env:
          DATABASE_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Start CakePHP development server
        run: |
          php bin/cake.php server -p 8765 -H 127.0.0.1 > /tmp/cake-server.log 2>&1 &
          echo $! > server.pid
          SERVER_PID=$(cat server.pid)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '' http://ci-e2e.invalid 2>/dev/null; then
              break
            fi
            sleep 2
          done
        env:
          DATABASE_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Run Playwright E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }}
        env:
          PLAYWRIGHT_BASE_URL: http://ci-e2e.invalid:8765
          PLAYWRIGHT_E2E_USERNAME: e2e
          PLAYWRIGHT_E2E_PASSWORD: Racersbb1952!
          CI: true

      - name: Stop CakePHP server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

  test-presence-guard:
    name: Test Presence Guard
    needs: preflight
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Ensure test changes are present for code changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          if grep -Eqi '\[skip-test-presence\]' <<< "${PR_TITLE}\n${PR_BODY}"; then
            exit 0
          fi
          changed_files="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" || true)"
          if [[ -z "$changed_files" ]]; then exit 0; fi

          code_changes="$(grep -E '^(src/.*\.php|js/.*\.(js|mjs|cjs|ts|tsx)|webroot/js/.*\.(js|mjs|cjs|ts|tsx))$' <<< "$changed_files" || true)"
          if [[ -z "$code_changes" ]]; then exit 0; fi

          test_changes="$(grep -E '^(tests/|js/tests/|e2e/)' <<< "$changed_files" || true)"
          if [[ -z "$test_changes" ]]; then
            echo "::error::Code files changed but no test files were updated."
            exit 1
          fi

  test-gate:
    name: Test Gate (Preflight-aware)
    if: ${{ always() }}
    needs:
      - preflight
      - testsuite
      - js-tests
      - e2e-tests
      - test-presence-guard
    runs-on: ubuntu-24.04

    steps:
      - name: Evaluate gated test outcomes
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          RUN_PHP: ${{ needs.preflight.outputs.run_php }}
          RUN_JS: ${{ needs.preflight.outputs.run_js }}
          RUN_E2E: ${{ needs.preflight.outputs.run_e2e }}
          TESTSUITE_RESULT: ${{ needs.testsuite.result }}
          JS_TESTS_RESULT: ${{ needs['js-tests'].result }}
          E2E_TESTS_RESULT: ${{ needs['e2e-tests'].result }}
          TEST_PRESENCE_RESULT: ${{ needs['test-presence-guard'].result }}
        run: |
          set -euo pipefail
          failures=0
          ensure_success() {
            if [[ "$2" != "success" ]]; then failures=$((failures + 1)); fi
          }
          ensure_success_or_skipped() {
            if [[ "$2" != "success" && "$2" != "skipped" ]]; then failures=$((failures + 1)); fi
          }

          ensure_success "preflight" "$PREFLIGHT_RESULT"

          if [[ "$RUN_PHP" == "true" ]]; then
            ensure_success "testsuite" "$TESTSUITE_RESULT"
          else
            ensure_success_or_skipped "testsuite" "$TESTSUITE_RESULT"
          fi

          if [[ "$RUN_JS" == "true" ]]; then
            ensure_success "js-tests" "$JS_TESTS_RESULT"
          else
            ensure_success_or_skipped "js-tests" "$JS_TESTS_RESULT"
          fi

          if [[ "$RUN_E2E" == "true" ]]; then
            ensure_success "e2e-tests" "$E2E_TESTS_RESULT"
          else
            ensure_success_or_skipped "e2e-tests" "$E2E_TESTS_RESULT"
          fi

          ensure_success_or_skipped "test-presence-guard" "$TEST_PRESENCE_RESULT"

          if [[ "$failures" -gt 0 ]]; then
            exit 1
          fi


