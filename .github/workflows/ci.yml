name: CI

on:
  push:
    branches: [v-0.2.0.beta, v-1.0.dev]
  pull_request:
    branches: [v-0.2.0.beta, v-1.0.dev]
  workflow_dispatch:

permissions:
  contents: read
  checks: write # allow Codecov to create checks/statuses
  pull-requests: write

jobs:
  testsuite:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: racerhistory_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.1"
            dependencies: "lowest"
            composer-options: "--prefer-lowest"
            coverage: true
          - php-version: "8.2"
            dependencies: "highest"
            composer-options: ""
            coverage: false
          - php-version: "8.3"
            dependencies: "highest"
            composer-options: ""
            coverage: false

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_mysql, zip, curl, xml, json
          ini-values: zend.assertions=1
          coverage: ${{ matrix.coverage == true && 'xdebug' || 'none' }}
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ matrix.php-version == '8.1' && '--ignore-platform-req=php' || matrix.composer-options }}

      - name: Handle PHP 8.1 compatibility
        if: ${{ matrix.php-version == '8.1' && matrix.dependencies == 'lowest' }}
        run: |
          # For PHP 8.1 with lowest dependencies, update to compatible versions
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer update --prefer-lowest --with-dependencies --no-progress --ignore-platform-req=php

      - name: Validate Composer dependencies
        run: composer validate --strict --no-check-publish

      - name: Copy configuration file
        run: cp config/app_local.example.php config/app_local.php

      - name: Setup test database configuration
        run: |
          sed -i "s/'host' => 'localhost'/'host' => '127.0.0.1'/" config/app_local.php
          sed -i "s/'username' => 'my_app'/'username' => 'test_user'/" config/app_local.php
          sed -i "s/'password' => 'secret'/'password' => 'test_password'/" config/app_local.php
          sed -i "s/'database' => 'my_app'/'database' => 'racerhistory_test'/" config/app_local.php
          # Also update the test datasource to use MySQL
          sed -i "s/'url' => env('DATABASE_TEST_URL', 'sqlite:\/\/\/.*')/'url' => env('DATABASE_TEST_URL', 'mysql:\/\/test_user:test_password@127.0.0.1:3306\/racerhistory_test')/" config/app_local.php

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot && break
            echo "Waiting for MySQL to be ready..."
            sleep 2
          done
          # Ensure test database exists and user has permissions
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS racerhistory_test; GRANT ALL PRIVILEGES ON racerhistory_test.* TO 'test_user'@'%';"

      - name: Fix migration compatibility
        run: |
          echo "=== Detecting installed migrations plugin version ==="
          shopt -s nullglob
          migration_files=(config/Migrations/[0-9]*.php)
          seed_files=(config/Seeds/*.php)
          echo "Found ${#migration_files[@]} migration file(s), ${#seed_files[@]} seed file(s)."

          # Detect which base classes the installed plugin provides
          if [ -f "vendor/cakephp/migrations/src/BaseMigration.php" ]; then
            echo "Using 5.x classes (BaseMigration / BaseSeed)"
            for f in "${migration_files[@]}"; do
              sed -i 's/use Migrations\\AbstractMigration;/use Migrations\\BaseMigration;/g' "$f"
              sed -i 's/extends AbstractMigration/extends BaseMigration/g' "$f"
            done
            for f in "${seed_files[@]}"; do
              sed -i 's/use Migrations\\AbstractSeed;/use Migrations\\BaseSeed;/g' "$f"
              sed -i 's/extends AbstractSeed/extends BaseSeed/g' "$f"
            done
            PARENT_FILE="vendor/cakephp/migrations/src/BaseMigration.php"
          else
            echo "Using legacy classes (AbstractMigration / AbstractSeed)"
            for f in "${migration_files[@]}"; do
              sed -i 's/use Migrations\\BaseMigration;/use Migrations\\AbstractMigration;/g' "$f"
              sed -i 's/extends BaseMigration/extends AbstractMigration/g' "$f"
            done
            for f in "${seed_files[@]}"; do
              sed -i 's/use Migrations\\BaseSeed;/use Migrations\\AbstractSeed;/g' "$f"
              sed -i 's/extends BaseSeed/extends AbstractSeed/g' "$f"
            done
            PARENT_FILE="vendor/cakephp/migrations/src/AbstractMigration.php"
          fi

          # Ensure autoId typing matches parent
          echo "=== Fixing autoId property type ==="
          if grep -q 'public bool \$autoId' "$PARENT_FILE" 2>/dev/null; then
            echo "Parent requires typed bool."
            for f in "${migration_files[@]}"; do
              perl -pi -e 's/public\s+(?:bool\s+)?\$autoId\s*=\s*(true|false)\s*;/public bool \$autoId = $1;/g' "$f"
            done
          else
            echo "Parent requires untyped."
            for f in "${migration_files[@]}"; do
              perl -pi -e 's/public\s+(?:bool\s+)?\$autoId\s*=\s*(true|false)\s*;/public \$autoId = $1;/g' "$f"
            done
          fi

          echo "=== Sample post-fix lines ==="
          grep -R --line-number -E 'public\s+(bool\s+)?\$autoId\s*=\s*(true|false)\s*;' config/Migrations/ || true

      - name: Run database migrations
        run: |
          bin/cake migrations migrate
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Clear application caches
        run: |
          rm -rf tmp/cache/models/*
          rm -rf tmp/cache/persistent/*
          bin/cake cache clear_all || true

      - name: Debug migration files
        run: |
          echo "=== Debug migration files ==="
          find config/Migrations -name "*.php" -exec basename {} \;
          echo "=== Checking for BaseMigration references ==="
          grep -r "BaseMigration" config/Migrations/ || echo "No BaseMigration references found"
          echo "=== Migrations version ==="
          composer show cakephp/migrations
          echo "=== Check BaseMigration autoId property ==="
          PARENT_FILE="vendor/cakephp/migrations/src/BaseMigration.php"
          if [ ! -f "$PARENT_FILE" ]; then
            PARENT_FILE="vendor/cakephp/migrations/src/AbstractMigration.php"
          fi
          grep -A 3 -B 3 "autoId" "$PARENT_FILE" || echo "autoId property not found"
          echo "=== PHPUnit version ==="
          vendor/bin/phpunit --version
          echo "=== PHP version ==="
          php -v | head -1

      - name: Composer post install
        run: composer run-script post-install-cmd --no-interaction

      - name: Run PHPUnit (with coverage)
        if: ${{ matrix.coverage == true }}
        run: |
          echo "=== Running test suite with coverage ==="
          vendor/bin/phpunit --configuration phpunit.ci.xml
          ls -lh coverage.xml || { echo 'coverage.xml missing'; exit 1; }
          head -20 coverage.xml || true
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test
          XDEBUG_MODE: coverage
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # gitleaks:allow

      - name: Debug test environment
        run: |
          echo "=== Environment Check ==="
          echo "PWD: $(pwd)"
          echo "PHP Version: $(php -v)"
          echo "DATABASE_TEST_URL: ${DATABASE_TEST_URL}"
          echo "=== Database connectivity ==="
          mysql -h 127.0.0.1 -u test_user -ptest_password -e "SHOW DATABASES;" | grep racerhistory_test || echo "Database not accessible"
          echo "=== Test bootstrap check ==="
          php -l tests/bootstrap.php
          echo "=== PHPUnit config check ==="
          php -l phpunit.xml.dist || echo "PHPUnit config issue"
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Run PHPUnit (without coverage)
        if: ${{ matrix.coverage == false }}
        run: |
          echo "=== Running PHPUnit without coverage (default config) ==="
          vendor/bin/phpunit
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.coverage == true }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # gitleaks:allow
          files: coverage.xml
          flags: php81-lowest,unittests
          name: codecov-racerhistory
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # gitleaks:allow
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.php-version }}
          path: test-results.xml

  coding-standard:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.3"
          extensions: mbstring, intl
          tools: cs2pr
          coverage: none
          ini-values: memory_limit=512M
          dependency-versions: "highest"
          composer-options: ""

      - name: Copy configuration file
        run: cp config/app_local.example.php config/app_local.php

      - name: Run PHP CodeSniffer
        run: vendor/bin/phpcs --report=checkstyle | cs2pr

      - name: Run PHPStan
        if: always()
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=512M
        env:
          SECURITY_SALT: f76f1c8475585c46c6acd3ddcb8f5e0f15de524637bb4080a08c4afe7cfc9144

  js-tests:
    name: JavaScript Tests (Jest + ESM)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM deps
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint:js

      - name: Check Prettier formatting
        run: npm run format:js:check

      - name: Run Jest tests with coverage
        run: npm run test:js -- --ci --coverage

      - name: Upload JS coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # gitleaks:allow
          files: coverage-js/clover.xml
          flags: jstests
          name: codecov-js
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # gitleaks:allow

      - name: Run CSS lint
        run: npm run lint:css

      - name: Upload JS coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: js-coverage
          path: coverage-js

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: racerhistory_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup PHP for dev server
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql
          coverage: none
          dependency-versions: "highest"

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Copy configuration file
        run: cp config/app_local.example.php config/app_local.php

      - name: Setup test database configuration
        run: |
          sed -i "s/'host' => 'localhost'/'host' => '127.0.0.1'/" config/app_local.php
          sed -i "s/'username' => 'my_app'/'username' => 'test_user'/" config/app_local.php
          sed -i "s/'password' => 'secret'/'password' => 'test_password'/" config/app_local.php
          sed -i "s/'database' => 'my_app'/'database' => 'racerhistory_test'/" config/app_local.php

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot && break
            echo "Waiting for MySQL to be ready..."
            sleep 2
          done
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS racerhistory_test; GRANT ALL PRIVILEGES ON racerhistory_test.* TO 'test_user'@'%';"

      - name: Fix migration compatibility (E2E)
        run: |
          shopt -s nullglob
          # Detect which base class the installed migrations plugin provides
          if [ -f "vendor/cakephp/migrations/src/BaseMigration.php" ]; then
            # 5.x: ensure files use BaseMigration / BaseSeed
            for f in config/Migrations/[0-9]*.php; do
              sed -i 's/use Migrations\\AbstractMigration;/use Migrations\\BaseMigration;/g' "$f"
              sed -i 's/extends AbstractMigration/extends BaseMigration/g' "$f"
            done
            for f in config/Seeds/*.php; do
              sed -i 's/use Migrations\\AbstractSeed;/use Migrations\\BaseSeed;/g' "$f"
              sed -i 's/extends AbstractSeed/extends BaseSeed/g' "$f"
            done
          else
            # Older: ensure files use AbstractMigration / AbstractSeed
            for f in config/Migrations/[0-9]*.php; do
              sed -i 's/use Migrations\\BaseMigration;/use Migrations\\AbstractMigration;/g' "$f"
              sed -i 's/extends BaseMigration/extends AbstractMigration/g' "$f"
            done
            for f in config/Seeds/*.php; do
              sed -i 's/use Migrations\\BaseSeed;/use Migrations\\AbstractSeed;/g' "$f"
              sed -i 's/extends BaseSeed/extends AbstractSeed/g' "$f"
            done
          fi
          # Ensure autoId typing matches parent
          PARENT_FILE="vendor/cakephp/migrations/src/BaseMigration.php"
          if [ ! -f "$PARENT_FILE" ]; then
            PARENT_FILE="vendor/cakephp/migrations/src/AbstractMigration.php"
          fi
          if grep -q 'public bool \$autoId' "$PARENT_FILE" 2>/dev/null; then
            for f in config/Migrations/[0-9]*.php; do
              perl -pi -e 's/public\s+(?:bool\s+)?\$autoId\s*=\s*(true|false)\s*;/public bool \$autoId = $1;/g' "$f"
            done
          else
            for f in config/Migrations/[0-9]*.php; do
              perl -pi -e 's/public\s+(?:bool\s+)?\$autoId\s*=\s*(true|false)\s*;/public \$autoId = $1;/g' "$f"
            done
          fi

      - name: Run database migrations
        run: bin/cake migrations migrate
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Seed E2E test data
        run: bin/cake seeds run E2eSeedData
        env:
          DATABASE_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Start CakePHP development server
        run: |
          php bin/cake.php server -p 8765 -H localhost > /tmp/cake-server.log 2>&1 &
          echo $! > server.pid
          SERVER_PID=$(cat server.pid)
          echo "Server started with PID $SERVER_PID"

          # Wait for server to be ready (check for any HTTP response, even errors)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '' http://localhost:8765/ 2>/dev/null; then
              echo "Server is responding!"
              break
            fi
            # Check if the server process died
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Server process died unexpectedly"
              cat /tmp/cake-server.log || true
              exit 1
            fi
            echo "Waiting for server to start... ($i/30)"
            sleep 2
          done

          # Final check: verify server is actually responding
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/ 2>/dev/null || echo "000")
          echo "Server responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::Server failed to start after 60 seconds"
            cat /tmp/cake-server.log || true
            exit 1
          fi
        env:
          DATABASE_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8765
          CI: true

      - name: Stop CakePHP server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi
          if [ -f /tmp/cake-server.log ]; then
            echo "=== Server log (last 50 lines) ==="
            tail -50 /tmp/cake-server.log || true
          fi

      - name: Upload Playwright test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-results
          path: test-results-e2e.xml
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30
