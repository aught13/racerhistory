name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write # allow Codecov to create checks/statuses
  pull-requests: write

jobs:
  testsuite:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: racerhistory_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.1"
            dependencies: "lowest"
            composer-options: "--prefer-lowest"
            coverage: true
          - php-version: "8.2"
            dependencies: "highest"
            composer-options: ""
            coverage: false
          - php-version: "8.3"
            dependencies: "highest"
            composer-options: ""
            coverage: false

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.30.4
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_mysql, zip, curl, xml, json
          ini-values: zend.assertions=1
          coverage: ${{ matrix.coverage == true && 'xdebug' || 'none' }}

      - name: Composer install
        uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520 # v3.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ matrix.php-version == '8.1' && '--ignore-platform-req=php' || matrix.composer-options }}
        env:
          COMPOSER_ALLOW_SUPERUSER: 1

      - name: Handle PHP 8.1 compatibility
        if: ${{ matrix.php-version == '8.1' && matrix.dependencies == 'lowest' }}
        run: |
          # For PHP 8.1 with lowest dependencies, update to compatible versions
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer update --prefer-lowest --with-dependencies --no-progress --ignore-platform-req=php

      - name: Validate Composer dependencies
        run: composer validate --strict --no-check-publish

      - name: Copy configuration file
        run: cp config/app_local.example.php config/app_local.php

      - name: Setup test database configuration
        run: |
          sed -i "s/'host' => 'localhost'/'host' => '127.0.0.1'/" config/app_local.php
          sed -i "s/'username' => 'my_app'/'username' => 'test_user'/" config/app_local.php
          sed -i "s/'password' => 'secret'/'password' => 'test_password'/" config/app_local.php
          sed -i "s/'database' => 'my_app'/'database' => 'racerhistory_test'/" config/app_local.php
          # Also update the test datasource to use MySQL
          sed -i "s/'url' => env('DATABASE_TEST_URL', 'sqlite:\/\/\/.*')/'url' => env('DATABASE_TEST_URL', 'mysql:\/\/test_user:test_password@127.0.0.1:3306\/racerhistory_test')/" config/app_local.php

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot && break
            echo "Waiting for MySQL to be ready..."
            sleep 2
          done
          # Ensure test database exists and user has permissions
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS racerhistory_test; GRANT ALL PRIVILEGES ON racerhistory_test.* TO 'test_user'@'%';"

      - name: Fix migration compatibility
        run: |
          echo "=== Checking AbstractMigration autoId property declaration ==="
          PARENT_DECLARATION=$(grep -A 1 -B 1 "autoId" vendor/cakephp/migrations/src/AbstractMigration.php | grep "public" || echo "not found")
          echo "Parent class has: $PARENT_DECLARATION"

          if echo "$PARENT_DECLARATION" | grep -q "bool.*autoId"; then
            echo "Parent requires bool type, updating migrations..."
            # Initial migration
            sed -i 's/public $autoId = false;/public bool $autoId = false;/' config/Migrations/20250727202625_Initial.php || true
            # Users table migration (newer)
            sed -i 's/public \$autoId = false;/public bool $autoId = false;/' config/Migrations/20250811120000_CreateUsersTable.php || true
            # Persons table migration (newer)
            sed -i 's/public \$autoId = false;/public bool $autoId = false;/' config/Migrations/20250817120000_AddBioToPersons.php || true
            # Images table migration
            sed -i 's/public \$autoId = false;/public bool $autoId = false;/' config/Migrations/20250817123000_CreateImagesTable.php || true
            # Image Usage table migration
            sed -i 's/public \$autoId = false;/public bool $autoId = false;/' config/Migrations/20250817123100_CreateImageUsagesTable.php || true
            # Sport Configs table migration (new)
            sed -i 's/public \$autoId = false;/public bool $autoId = false;/' config/Migrations/20251003140000_CreateSportConfigs.php || true
            # Enhance Games Table migration (new)
            sed -i 's/public \$autoId = false;/public bool $autoId = false;/' config/Migrations/20251003141000_EnhanceGamesTableForMultiSport.php || true
            # Sport Stat Registry migration (new)
            sed -i 's/public \$autoId = false;/public bool $autoId = false;/' config/Migrations/20251012150000_CreateSportStatRegistry.php || true
            # (Removed obsolete image path migrations)
          else
            echo "Parent requires no type, updating migrations to untyped..."
            # Initial migration
            sed -i 's/public bool $autoId = false;/public $autoId = false;/' config/Migrations/20250727202625_Initial.php || true
            # Users table migration (newer)
            sed -i 's/public bool $autoId = false;/public $autoId = false;/' config/Migrations/20250811120000_CreateUsersTable.php || true
            # Persons table migration (newer)
            sed -i 's/public bool $autoId = false;/public $autoId = false;/' config/Migrations/20250817120000_AddBioToPersons.php || true
            # Images table migration
            sed -i 's/public bool $autoId = false;/public $autoId = false;/' config/Migrations/20250817123000_CreateImagesTable.php || true
            # Image Usage table migration
            sed -i 's/public bool $autoId = false;/public $autoId = false;/' config/Migrations/20250817123100_CreateImageUsagesTable.php || true
            # Sport Configs table migration (new)
            sed -i 's/public bool $autoId = false;/public $autoId = false;/' config/Migrations/20251003140000_CreateSportConfigs.php || true
            # Enhance Games Table migration (new)
            sed -i 's/public bool $autoId = false;/public $autoId = false;/' config/Migrations/20251003141000_EnhanceGamesTableForMultiSport.php || true
            # Sport Stat Registry migration (new)
            sed -i 's/public bool $autoId = false;/public $autoId = false;/' config/Migrations/20251012150000_CreateSportStatRegistry.php || true
            # (Removed obsolete image path migrations)
          fi

          echo "=== Final migration property ==="
          echo "-- 20250727202625_Initial.php --"
          grep -A 1 -B 1 "autoId" config/Migrations/20250727202625_Initial.php || echo "no autoId in Initial"
          echo "-- 20250811120000_CreateUsersTable.php --"
          grep -A 1 -B 1 "autoId" config/Migrations/20250811120000_CreateUsersTable.php || echo "no autoId in CreateUsersTable"
          echo "-- 20250727202625_Initial.php --"
          grep -A 1 -B 1 "autoId" config/Migrations/20250817120000_AddBioToPersons.php || echo "no autoId in AddBioToPersons"
          echo "-- 20250811120000_CreateUsersTable.php --"
          grep -A 1 -B 1 "autoId" config/Migrations/20250817123000_CreateImagesTable.php || echo "no autoId in CreateImagesTable"
          echo "-- 20250811120000_CreateUsersTable.php --"
          grep -A 1 -B 1 "autoId" config/Migrations/20250817123100_CreateImageUsagesTable.php || echo "no autoId in CreateImageUsagesTable"
          # Removed obsolete migration files (AddStorageSubdir / ReplaceStorageSubdirWithStoragePath)

      - name: Run database migrations
        run: |
          bin/cake migrations migrate
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Clear application caches
        run: |
          rm -rf tmp/cache/models/*
          rm -rf tmp/cache/persistent/*
          bin/cake cache clear_all || true

      - name: Debug migration files
        run: |
          echo "=== Debug migration files ==="
          find config/Migrations -name "*.php" -exec basename {} \;
          echo "=== Checking for BaseMigration references ==="
          grep -r "BaseMigration" config/Migrations/ || echo "No BaseMigration references found"
          echo "=== Migrations version ==="
          composer show cakephp/migrations
          echo "=== Check AbstractMigration autoId property ==="
          grep -A 3 -B 3 "autoId" vendor/cakephp/migrations/src/AbstractMigration.php || echo "autoId property not found"
          echo "=== PHPUnit version ==="
          vendor/bin/phpunit --version
          echo "=== PHP version ==="
          php -v | head -1

      - name: Composer post install
        run: composer run-script post-install-cmd --no-interaction

      - name: Run PHPUnit (with coverage)
        if: ${{ matrix.coverage == true }}
        run: |
          echo "=== Running test suite with coverage ==="
          vendor/bin/phpunit --configuration phpunit.ci.xml
          ls -lh coverage.xml || { echo 'coverage.xml missing'; exit 1; }
          head -20 coverage.xml || true
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test
          XDEBUG_MODE: coverage
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Debug test environment
        run: |
          echo "=== Environment Check ==="
          echo "PWD: $(pwd)"
          echo "PHP Version: $(php -v)"
          echo "DATABASE_TEST_URL: ${DATABASE_TEST_URL}"
          echo "=== Database connectivity ==="
          mysql -h 127.0.0.1 -u test_user -ptest_password -e "SHOW DATABASES;" | grep racerhistory_test || echo "Database not accessible"
          echo "=== Test bootstrap check ==="
          php -l tests/bootstrap.php
          echo "=== PHPUnit config check ==="
          php -l phpunit.xml.dist || echo "PHPUnit config issue"
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Run PHPUnit (without coverage)
        if: ${{ matrix.coverage == false }}
        run: |
          echo "=== Running PHPUnit without coverage (default config) ==="
          vendor/bin/phpunit
        env:
          DATABASE_TEST_URL: mysql://test_user:test_password@127.0.0.1:3306/racerhistory_test

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.coverage == true }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: php81-lowest,unittests
          name: codecov-racerhistory
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.4.3
        if: always()
        with:
          name: test-results-${{ matrix.php-version }}
          path: test-results.xml

  coding-standard:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.30.4
        with:
          php-version: "8.3"
          extensions: mbstring, intl
          coverage: none
          tools: cs2pr
          ini-values: memory_limit=512M

      - name: Composer install
        uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520 # v3.0.0
        with:
          dependency-versions: "highest"
          composer-options: ""
        env:
          COMPOSER_ALLOW_SUPERUSER: 1

      - name: Copy configuration file
        run: cp config/app_local.example.php config/app_local.php

      - name: Run PHP CodeSniffer
        run: vendor/bin/phpcs --report=checkstyle | cs2pr

      - name: Run PHPStan
        if: always()
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=512M
        env:
          SECURITY_SALT: f76f1c8475585c46c6acd3ddcb8f5e0f15de524637bb4080a08c4afe7cfc9144

  js-tests:
    name: JavaScript Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM deps
        run: npm ci --no-audit --no-fund

      - name: Run JS tests
        run: npm run test:js -- --ci

      - name: Upload JS coverage artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: js-coverage
          path: coverage-js
