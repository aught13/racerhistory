<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#002144">
  <title>RacerHistory | Offline</title>
  <style>
    :root {
      color-scheme: light dark;
      --rh-navy: #002144;
      --rh-gold: #ecac00;
      --rh-bg: #f5f1ed;
      --rh-text: #0b0f14;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--rh-bg);
      color: var(--rh-text);
      font-family: Georgia, "Times New Roman", serif;
      padding: 1rem;
    }

    main {
      width: min(38rem, 100%);
      background: #fff;
      border: 1px solid rgba(0, 33, 68, 0.2);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 33, 68, 0.08);
    }

    h1 {
      margin-top: 0;
      color: var(--rh-navy);
      font-size: 1.6rem;
      line-height: 1.2;
    }

    p {
      margin: 0.75rem 0;
      line-height: 1.5;
    }

    .actions {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .primary {
      background: var(--rh-navy);
      color: #fff;
    }

    .secondary {
      background: transparent;
      border-color: var(--rh-navy);
      color: var(--rh-navy);
    }

    a:focus,
    a:hover {
      outline: none;
      box-shadow: 0 0 0 3px rgba(236, 172, 0, 0.35);
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>RacerHistory could not reach the network. Cached pages may still be available while your connection is down.</p>
    <p>Reconnect and try again, or go back to a cached page.</p>
    <div class="actions">
      <a class="primary" href="/">Go To Home</a>
      <a class="secondary" href="/blog">Read Latest News</a>
    </div>
  </main>
</body>
</html>
